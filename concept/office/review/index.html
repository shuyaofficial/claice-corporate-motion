<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>トップページの感想｜株式会社クレイス</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#19281f;font:16px/1.7 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:36px clamp(18px,5vw,65px) 64px}h1{font-size:clamp(32px,6vw,60px);line-height:1.2;letter-spacing:-.05em;margin:.45em 0}.nav{display:flex;flex-wrap:wrap;gap:12px 24px;margin:0 0 28px}a{color:#164b71;text-underline-offset:4px}.screens{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:10px;align-items:start}.screens figure{margin:0}.screens img{width:100%;height:auto;display:block}figcaption{font-size:13px}.q{min-width:0;margin:28px 0;padding:12px 0 20px;border:0;border-top:1px solid #77857c}.q legend{font-size:clamp(18px,3vw,25px);font-weight:700;line-height:1.5;padding-right:12px}.choice,.memo{display:block;padding:5px 0}.memo{margin-top:10px}textarea{width:100%;min-height:70px;font:inherit;display:block;border:1px solid #7c8a82;padding:8px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px 10px}.photos label{font-size:13px;cursor:pointer}.photos img{display:block;width:100%;aspect-ratio:1.5;object-fit:contain;background:#e8e6de}.photos input{accent-color:#134e72}.dock-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.dock button{color:white;background:#223a2d;border:1px solid #223a2d;padding:9px 14px;font:inherit;cursor:pointer}.dock .ghost{background:transparent;color:#223a2d}summary{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #0075b2;outline-offset:2px}
</style></head><body><main>
<nav class="nav" aria-label="試作を比較"><a href="../index.html">新しいトップを見る</a><a href="../../walk/index.html">前回のツアー版を見る</a></nav>
<h1>トップページの感想</h1>
<div class="screens"><figure><a href="../preview-pc.webp"><img src="../preview-pc.webp" alt="新しいトップページのPC画面"></a><figcaption>PC</figcaption></figure><figure><a href="../preview-sp.webp"><img src="../preview-sp.webp" alt="新しいトップページのスマートフォン画面"></a><figcaption>スマートフォン</figcaption></figure></div>
<fieldset class="q" data-q="transition" data-title="ラウンジから執務席への切り替わり"><legend>Q1. ラウンジから執務席へ移るスクロールは、どう感じましたか？</legend><label class="choice"><input type="radio" name="transition" value="この切り替わりを残したい"> この切り替わりを残したい</label>
<label class="choice"><input type="radio" name="transition" value="もう少しゆっくり写真を見たい"> もう少しゆっくり写真を見たい</label>
<label class="choice"><input type="radio" name="transition" value="もう少し早く仕事の紹介に進みたい"> もう少し早く仕事の紹介に進みたい</label>
<label class="choice"><input type="radio" name="transition" value="別のつなぎ方を見たい"> 別のつなぎ方を見たい</label>
<label class="memo">気になった瞬間<textarea name="transition-note"></textarea></label></fieldset>
<fieldset class="q" data-q="photos" data-title="もっと大きく見たい写真"><legend>Q2. トップでもっと大きく見たい写真はありますか？</legend>
<p>複数選べます。今のままがよければ、下の記入欄で教えてください。</p><div class="photos"><label><img loading="lazy" src="../img/01.webp" alt=""><input type="checkbox" name="photos" value="写真1 社名の壁"> 01　社名の壁</label>
<label><img loading="lazy" src="../img/02.webp" alt=""><input type="checkbox" name="photos" value="写真2 ラウンジのテーブル"> 02　ラウンジのテーブル</label>
<label><img loading="lazy" src="../img/03.webp" alt=""><input type="checkbox" name="photos" value="写真3 窓際の照明"> 03　窓際の照明</label>
<label><img loading="lazy" src="../img/04.webp" alt=""><input type="checkbox" name="photos" value="写真4 ラウンジから見た執務席"> 04　ラウンジから見た執務席</label>
<label><img loading="lazy" src="../img/05.webp" alt=""><input type="checkbox" name="photos" value="写真5 ラウンジ全景"> 05　ラウンジ全景</label>
<label><img loading="lazy" src="../img/06.webp" alt=""><input type="checkbox" name="photos" value="写真6 ボックス席"> 06　ボックス席</label>
<label><img loading="lazy" src="../img/07.webp" alt=""><input type="checkbox" name="photos" value="写真7 カウンター"> 07　カウンター</label>
<label><img loading="lazy" src="../img/08.webp" alt=""><input type="checkbox" name="photos" value="写真8 執務中の社員"> 08　執務中の社員</label>
<label><img loading="lazy" src="../img/09.webp" alt=""><input type="checkbox" name="photos" value="写真9 会議室の窓"> 09　会議室の窓</label>
<label><img loading="lazy" src="../img/10.webp" alt=""><input type="checkbox" name="photos" value="写真10 会議室から見た社名の壁"> 10　会議室から見た社名の壁</label>
<label><img loading="lazy" src="../img/11.webp" alt=""><input type="checkbox" name="photos" value="写真11 ガラス越しの会議室"> 11　ガラス越しの会議室</label>
</div><label class="memo">写真の順番や、短くしたい場面<textarea name="photos-note"></textarea></label></fieldset><details class="result">
  <summary>チャットに貼る文を見る</summary>
  <textarea id="result" readonly aria-label="チャットに貼る文"></textarea>
</details>


<div class="dock">
  <div class="dock-in">
    <span class="count" id="count">回答 0 / 2</span>
    <button type="button" id="copy">回答をコピー</button>
    <button type="button" class="ghost" id="clear">入力を消す</button>
    <span id="copied" role="status"></span>
  </div>
</div>

<script>
(function(){

  /* 回答の集め方 */
  var KEY='claice-office-photo-feedback-v1';
  var qs=[].slice.call(document.querySelectorAll('fieldset.q'));
  var result=document.getElementById('result'),copied=document.getElementById('copied'),count=document.getElementById('count');
  function answerOf(fs){
    var name=fs.dataset.q;
    var picked=[].slice.call(fs.querySelectorAll('input:checked')).map(function(i){return i.value;});
    var note=(fs.querySelector('textarea')||{}).value||'';
    return {title:fs.querySelector('legend').textContent.trim(),picked:picked,note:note.trim()};
  }
  function collect(){
    var lines=['【クレイス・11枚の写真でつくるトップ】'],n=0;
    qs.forEach(function(fs){
      var a=answerOf(fs); if(!a.picked.length&&!a.note) return; n++;
      lines.push('- '+a.title+'：'+(a.picked.length?a.picked.join('／'):'（選択なし）')+(a.note?'\n  メモ：'+a.note.replace(/\n/g,' '):''));
    });
    if(!n) lines.push('（まだ回答がありません）');
    count.textContent='回答 '+n+' / '+qs.length;
    return lines.join('\n');
  }
  function save(){
    try{
      var d={};
      document.querySelectorAll('fieldset.q input').forEach(function(i){ if(i.checked)(d[i.name]=d[i.name]||[]).push(i.value); });
      document.querySelectorAll('fieldset.q textarea').forEach(function(t){ if(t.value) d['t:'+t.name]=t.value; });
      localStorage.setItem(KEY,JSON.stringify(d));
    }catch(e){}
  }
  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY)||'{}');
      document.querySelectorAll('fieldset.q input').forEach(function(i){ if((d[i.name]||[]).indexOf(i.value)>=0) i.checked=true; });
      document.querySelectorAll('fieldset.q textarea').forEach(function(t){ if(d['t:'+t.name]) t.value=d['t:'+t.name]; });
    }catch(e){}
  }
  load(); result.value=collect();
  document.addEventListener('input',function(e){ if(!e.target.closest('fieldset.q')) return; save(); result.value=collect(); copied.textContent=''; });
  document.addEventListener('change',function(e){ if(!e.target.closest('fieldset.q')) return; save(); result.value=collect(); copied.textContent=''; });
  document.getElementById('copy').addEventListener('click',function(){
    var text=collect(); result.value=text;
    var done=function(){ copied.textContent='コピーしました。チャットの入力欄に貼ってください'; };
    var fallback=function(){ document.querySelector('details.result').open=true; result.removeAttribute('readonly'); result.focus(); result.select(); result.setAttribute('readonly',''); copied.textContent='自動でコピーできなかったので、文を選択しました。端末のコピー操作で控えてください'; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,fallback); } else fallback();
  });
  document.getElementById('clear').addEventListener('click',function(){
    document.querySelectorAll('fieldset.q input').forEach(function(i){ i.checked=false; });
    document.querySelectorAll('fieldset.q textarea').forEach(function(t){ t.value=''; });
    try{localStorage.removeItem(KEY);}catch(e){} result.value=collect(); copied.textContent='入力を消しました';
  });
})();
</script>
</main></body></html>
